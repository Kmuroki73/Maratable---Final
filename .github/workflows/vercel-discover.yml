name: Discover Vercel project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Find MaraTable project across personal account and teams
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is missing from GitHub Actions repository secrets."
            exit 1
          fi

          AUTH=(-H "Authorization: Bearer ${VERCEL_TOKEN}")
          USER="$(curl --silent --show-error --fail "${AUTH[@]}" "https://api.vercel.com/v2/user")"
          TEAMS="$(curl --silent --show-error --fail "${AUTH[@]}" "https://api.vercel.com/v2/teams?limit=100")"
          PERSONAL="$(curl --silent --show-error --fail "${AUTH[@]}" "https://api.vercel.com/v9/projects?limit=100")"

          TEAM_PROJECTS='[]'
          while IFS= read -r TEAM_ID; do
            [ -n "$TEAM_ID" ] || continue
            RESULT="$(curl --silent --show-error --fail "${AUTH[@]}" "https://api.vercel.com/v9/projects?limit=100&teamId=${TEAM_ID}")"
            TEAM_PROJECTS="$(node -e '
              const a = JSON.parse(process.argv[1]);
              const b = JSON.parse(process.argv[2]);
              process.stdout.write(JSON.stringify(a.concat((b.projects || []).map(p => ({...p, teamId: p.teamId || process.argv[3]})))));
            ' "$TEAM_PROJECTS" "$RESULT" "$TEAM_ID")"
          done < <(node -e 'for (const t of (JSON.parse(process.argv[1]).teams || [])) console.log(t.id)' "$TEAMS")

          node -e '
            const user = JSON.parse(process.argv[1]).user || JSON.parse(process.argv[1]);
            const teams = JSON.parse(process.argv[2]).teams || [];
            const personal = JSON.parse(process.argv[3]).projects || [];
            const teamProjects = JSON.parse(process.argv[4]);
            const all = [...personal, ...teamProjects];
            const unique = [...new Map(all.map(p => [p.id, p])).values()];
            const matches = unique.filter(p => /mara/i.test(p.name || ""));
            console.log("Authenticated Vercel account:", JSON.stringify({
              username: user.username || null,
              email: user.email || null,
              userId: user.id || null
            }));
            console.log("Teams accessible:", teams.length);
            for (const t of teams) console.log("Team:", JSON.stringify({name:t.name, teamId:t.id, slug:t.slug}));
            if (!unique.length) {
              console.log("No projects returned in personal or team scopes. Check token owner and project access.");
              process.exit(0);
            }
            const list = matches.length ? matches : unique;
            console.log(matches.length ? "Matching MaraTable project(s):" : "No MaraTable name match; available projects:");
            for (const p of list) console.log(JSON.stringify({
              name:p.name,
              projectId:p.id,
              ownerId:p.teamId || p.accountId || null,
              teamId:p.teamId || null,
              accountId:p.accountId || null
            }));
          ' "$USER" "$TEAMS" "$PERSONAL" "$TEAM_PROJECTS"
